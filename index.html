<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E3" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#16202A" media="(prefers-color-scheme: dark)">
<title>LernFux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6E3;--surface:#FFFFFF;--ink:#1F2A37;--muted:#5A6472;--line:#E6D9BD;--mark:#FFC933;--accent:#0F7B6C;--card:#0F7B6C;--rand:#1F2A37;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16202A;--surface:#1F2C38;--ink:#F1F4F7;--muted:#A9B4C0;--line:#33434F;--mark:#FFC933;--accent:#5FD3BF;--card:#5FD3BF;--rand:#8FA3B5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16202A;--surface:#1F2C38;--ink:#F1F4F7;--muted:#A9B4C0;--line:#33434F;--mark:#FFC933;--accent:#5FD3BF;--card:#5FD3BF;--rand:#8FA3B5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.125rem/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem}
header{padding:1.25rem 0;border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.logo{font-weight:700;font-size:1.125rem;color:var(--ink);text-decoration:none}
main{padding:2.5rem 0 4rem}
h1{font-size:clamp(2rem,6vw,3.25rem);line-height:1.1;margin:0 0 .75rem;font-weight:700;letter-spacing:-.02em}
.lead{color:var(--muted);max-width:38rem;margin:0 0 2rem}
.search{width:100%;max-width:24rem;padding:.7rem .9rem;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1rem}
.card{display:block;padding:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card h2{font-size:1.25rem;margin:0 0 .4rem}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.97rem}
.bar{height:.6rem;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mark)}
.meta{font-size:.9rem;color:var(--muted);margin-top:.4rem}
.empty{padding:2rem;background:var(--surface);border:2px dashed var(--line);border-radius:10px;max-width:38rem}
.empty h2{margin:0 0 .5rem;font-size:1.25rem}
.empty p{margin:0;color:var(--muted)}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.5rem;margin:0 0 1rem;max-width:44rem}
.lesson h2{margin:0 0 .75rem;font-size:1.35rem}
.done{margin-top:1rem;font:inherit;font-weight:700;padding:.6rem 1rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.done[aria-pressed="true"]{background:var(--mark);border-color:var(--mark);color:#17233B}
header{position:relative}
.menubtn{display:flex;flex-direction:column;justify-content:center;gap:5px;width:2.75rem;height:2.75rem;padding:0 .65rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.menubtn span{display:block;height:2px;background:var(--ink);border-radius:2px}
.menu{position:absolute;right:1.25rem;top:calc(100% - .4rem);z-index:5;min-width:15rem;max-width:calc(100vw - 2.5rem);padding:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu a,.menu button,.menu .leer{display:block;text-align:left;padding:.65rem .75rem;border-radius:6px;font:inherit;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--bg)}
.menu .leer{color:var(--muted);cursor:default}
.menu hr{width:100%;border:0;border-top:1px solid var(--line);margin:.4rem 0}
footer{border-top:1px solid var(--line);padding:1.25rem 0;color:var(--muted);font-size:.9rem}
.lektionen{list-style:none;margin:0;padding:0;max-width:44rem}
.lektionen li{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.9rem 1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem}
.lektionen a{font-weight:700;text-decoration:none;color:var(--ink)}
.lektionen a:hover{color:var(--accent)}
.lektionen .meta{margin:0}
.quizbox{margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.quiz{margin-bottom:1.25rem}
.quiz h3{margin:0 0 .75rem;font-size:1.1rem}
.opt{display:block;width:100%;text-align:left;margin:0 0 .5rem;padding:.65rem .9rem;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--mark);border-color:var(--mark);color:#17233B}
.opt.falsch{border-style:dashed;color:var(--muted);text-decoration:line-through}
.fb{margin:.5rem 0 0;color:var(--muted)}
.score{margin:0}
.schritte{display:flex;justify-content:space-between;gap:1rem;max-width:44rem;margin-top:1.25rem}
.btn{display:inline-block;padding:.65rem 1.1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none}
.btn:hover{border-color:var(--accent)}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.7rem}
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.6rem}
.karte{min-height:6rem;padding:.9rem;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:left}
.karte.um{background:var(--mark);border-color:var(--mark);color:#17233B}
.merke{margin:1rem 0;padding:.9rem 1.1rem;border-left:4px solid var(--mark);background:var(--surface);border-radius:0 8px 8px 0;max-width:44rem}
.merke ul{margin:.4rem 0 0;padding-left:1.2rem}
.gesamt{max-width:24rem;margin:0 0 1.5rem}
.glossar dt{font-weight:700;margin-top:1rem}
.glossar dd{margin:.2rem 0 0;color:var(--muted);max-width:44rem}
.lesson img,.lesson video{max-width:100%;height:auto;border-radius:8px}
h1,h2,h3{font-weight:800}
.logo{font-weight:800;font-size:1.3rem}
header{border-bottom:3px solid var(--line)}
.card{border:3px solid var(--line);border-top:8px solid var(--c,var(--card));border-radius:20px}
.card .ico{font-size:2.4rem;line-height:1;display:block;margin-bottom:.4rem}
.bar{height:1rem;border-radius:99px}.bar i{border-radius:99px}
.lesson,.lektionen li,.merke,.empty,.blase{border-radius:18px}
.lesson{border-width:3px}
.opt{padding:.85rem 1.1rem;border-width:2px;border-radius:14px;font-weight:700;font-size:1.05rem}
.opt.ok::before{content:"\2713  "}
.btn,.done{border-radius:14px;border-width:2px;padding:.8rem 1.3rem;font-size:1.05rem}
.menu a,.menu button{font-size:1.05rem;font-weight:700}
.hallo{display:flex;gap:1rem;align-items:center;margin:0 0 1.5rem;max-width:44rem}
.fuchs{font-size:3.5rem;line-height:1}
.blase{background:var(--surface);border:3px solid var(--line);padding:.8rem 1.1rem;font-weight:700}
.blase p{margin:.3rem 0 0}.gruss{font-size:1.4rem;margin:0}
.sterne{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.5rem}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:.35rem .9rem;font-weight:800}
.chip.aus{opacity:.5;filter:grayscale(1)}
.konf{position:fixed;top:-2rem;z-index:50;pointer-events:none;font-size:1.6rem}
@media (prefers-reduced-motion:no-preference){.konf{animation:fall 1.8s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}}
@media (prefers-reduced-motion:reduce){.konf{display:none}}

.card,.lesson,.lektionen li,.opt,.btn,.done,.karte,.search,.menubtn,.muenz,textarea{border:2.5px solid var(--rand)}
.card,.lesson,.lektionen li,.btn,.done{box-shadow:0 4px 0 var(--rand)}
.card:hover{border-color:var(--rand);transform:translateY(-2px);box-shadow:0 6px 0 var(--rand)}
.card:active,.btn:active,.done:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rand)}
.opt{box-shadow:0 3px 0 var(--rand)}.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--rand)}.opt:disabled{box-shadow:none}
.btn:hover{border-color:var(--rand)}.done{background:var(--surface)}
.card .ico{display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:14px;border:2.5px solid var(--rand);background:var(--c,var(--mark));font-size:1.7rem;margin-bottom:.7rem}
.blase{position:relative;border:2.5px solid var(--rand)}
.blase::before{content:"";position:absolute;left:-10px;top:1.5rem;width:16px;height:16px;background:var(--surface);border-left:2.5px solid var(--rand);border-bottom:2.5px solid var(--rand);transform:rotate(45deg)}
.fuchs{width:5rem;height:5.3rem;flex:none}.fux{display:block}
.logofux{display:inline-block;width:1.9rem;height:2rem;vertical-align:-.5rem;margin-right:.4rem}
.fx-scarf{fill:var(--accent)}.fx-eyes{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.fx-eyes{animation:blink 4.5s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.bar i{animation:grow .9s ease-out}@keyframes grow{from{width:0}}}
.coin{display:inline-block;position:relative;width:1.5rem;height:1.5rem;border-radius:50%;background:#FFC933;border:2.5px solid #3B2A24;flex:none}
.coin::after{content:"";position:absolute;inset:3px;border:2px solid #B87900;border-radius:50%}
.coin.flug{position:fixed;z-index:60;pointer-events:none;width:24px;height:24px}
.muenz{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:1.15rem;background:var(--surface);border-radius:99px;padding:.2rem .85rem .2rem .4rem}
.toast{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:.9rem;max-width:min(24rem,calc(100vw - 2rem));pointer-events:none}
.toast[hidden]{display:none}.toast .fuchs{width:4rem;height:4.2rem}.toast .blase{font-size:.98rem}
.konf{width:9px;height:14px;font-size:0;border-radius:2px}
.lvl{max-width:30rem;margin:0 0 1.25rem}.lvl .bar{margin-top:.4rem;border:2px solid var(--rand)}
.meds{list-style:none;margin:0 0 1.75rem;padding:0;display:flex;flex-wrap:wrap;gap:.9rem}
.med{display:flex;flex-direction:column;align-items:center;width:5.2rem;text-align:center;font-size:.85rem;font-weight:700;line-height:1.2}
.plakette{display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:50%;background:var(--mark);border:2.5px solid var(--rand);box-shadow:0 3px 0 var(--rand);font-weight:800;color:#1F2A37;margin-bottom:.45rem}
.med.aus{color:var(--muted)}.med.aus .plakette{background:var(--line);box-shadow:none;color:var(--muted)}
.sr{position:absolute;left:-9999px}
.still .bar i{animation:none!important}
.zeile{display:flex;align-items:center;gap:.8rem;margin:.4rem 0;font-weight:700}
.zeile span{min-width:5rem}
.aufg,.rep{margin-bottom:1.4rem}
.aufg h3,.rep h3{margin:0 0 .6rem;font-size:1.1rem}
.antw,select{font:inherit;padding:.6rem .8rem;border-radius:12px;border:2.5px solid var(--rand);background:var(--surface);color:var(--ink);margin:.2rem .5rem .5rem 0}
.gl{background:none;border:0;border-bottom:3px dotted var(--accent);font:inherit;color:inherit;padding:0;cursor:pointer}
button.btn{font:inherit;font-weight:800;cursor:pointer}
.menu{max-height:70vh;overflow-y:auto}
.menu details{border-top:2px solid var(--line);margin-top:.3rem;padding-top:.3rem}
.menu summary{display:flex;justify-content:space-between;align-items:center;padding:.65rem .75rem;border-radius:6px;font-weight:800;font-size:1.05rem;cursor:pointer;list-style:none}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:"";width:.6rem;height:.6rem;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-3px) rotate(45deg)}
.menu details[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.menu summary:hover{background:var(--bg)}
.menu details a,.menu details button,.menu details .leer{padding-left:1.4rem}
body.aus .menubtn,body.aus .muenz{display:none}
.aufgtitel{font-size:1.6rem;margin:0 0 1rem;line-height:1.25}
.code{font-size:2rem;font-weight:800;letter-spacing:.08em;margin:0 0 1rem;word-break:break-all}
.qr{display:inline-block;background:#fff;padding:.5rem;border-radius:8px;border:2.5px solid var(--rand)}
.qr svg{display:block;width:min(16rem,70vw);height:auto}
.einst{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.4rem 0}
.warn{background:var(--mark);color:#17233B;padding:.7rem 1.25rem;font-weight:700;text-align:center}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;max-width:22rem}
.kal span{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid var(--line)}
.kal .d{background:var(--mark);border-color:var(--rand);font-weight:800;color:#17233B}
.kal .k,.kal .e{border:0;font-weight:800;color:var(--muted)}
.gesperrt{opacity:.55}
body.ruhig *{animation:none!important;transition:none!important}
.abschnitt{background:var(--surface);border:2.5px solid var(--rand);border-radius:16px;margin:0 0 1.25rem}
.abschnitt>summary{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;cursor:pointer;list-style:none;font-weight:800;font-size:1.25rem}
.abschnitt>summary::-webkit-details-marker{display:none}
.abschnitt>summary .meta{margin:0 auto 0 0;font-weight:400;font-size:.95rem}
.abschnitt>summary::after{content:"";flex:none;width:.7rem;height:.7rem;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-3px) rotate(45deg)}
.abschnitt[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
.abschnitt .inhalt{padding:0 1.2rem 1.2rem}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;max-width:22rem}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:18rem}
.mk{aspect-ratio:1;border:2.5px solid var(--rand);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:2rem;font-weight:800;cursor:pointer}
.mk.auf,.mk:disabled{background:var(--mark);color:#17233B}
@media print{header,footer,.schritte,.done{display:none}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
.schnell{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.7rem;margin:0 0 1.5rem}.schnell .card{text-align:center;padding:.9rem .5rem}.schnell .card h2{margin:.2rem 0 0;font-size:1.05rem}.schnell .ico{font-size:1.8rem}
table{font-size:1rem}
.voll{min-height:55vh;display:flex;flex-direction:column;justify-content:center}.voll .aufgtitel{font-size:1.7rem;margin-bottom:1rem}.voll .opt{font-size:1.15rem;padding:1rem}.voll #weiter{width:100%}
.gross{font-size:1.15rem;padding:.9rem 1.6rem;background:var(--mark);color:#17233B}.lektionen .meta{white-space:nowrap}
.vm{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:30rem}.vk{aspect-ratio:auto;min-height:5rem;font-size:1rem;padding:.3rem;word-break:break-word}
.badge{display:inline-block;background:var(--mark);color:#17233B;border-radius:99px;padding:0 .55rem;font-size:.8rem;font-weight:800;vertical-align:middle}
/* Feinschliff */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:29}
.menu{z-index:31}
body{background:radial-gradient(circle at 10% 0,rgba(255,201,51,.24),transparent 28rem),radial-gradient(circle at 100% 35%,rgba(15,123,108,.12),transparent 26rem),var(--bg);background-attachment:fixed}
.bar i{background-image:linear-gradient(135deg,rgba(255,255,255,.35) 25%,transparent 25% 50%,rgba(255,255,255,.35) 50% 75%,transparent 75%);background-size:1.2rem 1.2rem}
.card,.btn,.done,.opt,.karte,.menubtn{transition:transform .12s,box-shadow .12s,border-color .12s,background-color .12s}
.card .ico{transition:transform .2s}.card:hover .ico{transform:rotate(-8deg) scale(1.08)}
.fb.gut{color:var(--accent);font-weight:800}.fb.schlecht{color:#B4440E;font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fb.schlecht{color:#FFB38A}}
:root[data-theme="dark"] .fb.schlecht{color:#FFB38A}
.opt:hover:not(:disabled){transform:translateY(-1px)}
@media (prefers-reduced-motion:no-preference){
#app:not(.still)>*{animation:rein .45s cubic-bezier(.2,.8,.3,1) backwards}
#app:not(.still)>*:nth-child(2){animation-delay:.05s}#app:not(.still)>*:nth-child(3){animation-delay:.1s}#app:not(.still)>*:nth-child(n+4){animation-delay:.15s}
@keyframes rein{from{opacity:0;transform:translateY(14px)}}
.hallo .fuchs{animation:huepf 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes huepf{0%,100%{transform:none}50%{transform:translateY(-4px) rotate(-2deg)}}
.opt.ok{animation:puls .4s}@keyframes puls{50%{transform:scale(1.04)}}
.opt.falsch{animation:wackel .35s}@keyframes wackel{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
}
.reihe{list-style:none;padding:0;margin:.5rem 0}.reihe li{display:flex;align-items:center;gap:.5rem;margin:.4rem 0;padding:.4rem .8rem;border:2.5px solid var(--rand);border-radius:12px;background:var(--surface);font-weight:700}.reihe li span{flex:1}.reihe .kl{padding:.2rem .7rem}
.aufgbild{font-size:4rem;text-align:center;margin:.5rem 0;line-height:1}img.aufgbild{max-width:100%;max-height:14rem;display:block;margin:.5rem auto}
.satz{font-size:1.25rem;font-weight:700}.luecke{border-bottom:3px solid var(--rand);padding:0 1.2rem}
.zau{margin:.5rem 0;padding:.6rem .9rem;border:2px dashed var(--line);border-radius:12px;background:var(--surface)}.zau:empty{display:none}.zau ul{margin:.3rem 0 0;padding-left:1.2rem}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="#"><span class="logofux" id="logoFux"></span>LernFux</a>
<span class="muenz" id="muenz" title="Deine Münzen"><i class="coin"></i><b id="mz">0</b></span><button class="menubtn" id="menuBtn" type="button" aria-label="Menü" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button></div>
<nav class="menu" id="menu" aria-label="Hauptmenü" hidden></nav></header>
<main><div class="wrap" id="app"><noscript><p>LernFux braucht JavaScript. Bitte schalte es in deinem Browser ein.</p></noscript></div></main>
<footer><div class="wrap">Dein Fortschritt wird nur in diesem Browser gespeichert.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
/* Themen hier eintragen. Beispiel:
{ id:"beispiel", icon:"🔬", farbe:"#FF6B6B", titel:"Beispielthema", beschreibung:"Kurze Beschreibung.",
  lektionen:[ { id:"l1", titel:"Erste Lektion", inhalt:"<p>Text der Lektion.</p>",

  const ende = () => { const b = fortschritt._best = fortschritt._best || {}, k = "vm" + L.id, neu = !b[k] || zuege < b[k]; if(neu) b[k] = zuege; speichern(fortschritt); konfetti();
    app.innerHTML = '<h1>Geschafft!</h1>' + fuxBox("In <strong>" + zuege + "</strong> Zügen" + (neu ? ". Neuer Bestwert!" : ". Dein Bestwert: " + b[k] + " Züge."), "jubel") + '<p><button class="btn gross" id="m1" type="button">Nochmal (1 Münze)</button> <button class="btn" id="m2" type="button">Zu den Spielen</button></p>'; m1.onclick = () => spielStart(() => memStart(L)); m2.onclick = () => geheZu("#spiele"); };
  const klick = ci => { if(sperre || auf.includes(ci) || cs[ci].f) return; auf.push(ci);
    if(auf.length === 2){ zuege++; const x = cs[auf[0]], y = cs[auf[1]]; if(x.i === y.i && x.s !== y.s){ x.f = y.f = 1; paare++; auf = []; zeichne(); if(paare === ws.length) ende(); return; } sperre = true; zeichne(); spielT = setTimeout(() => { auf = []; sperre = false; zeichne(); }, 900); return; } zeichne(); };
  zeichne();
}
function spiele(){
  const g = [["memory","🧠","Memory","Finde alle Paare."],["tictac","❌","Drei gewinnt","Spiele gegen Fux."],["zahl","🔢","Zahlenraten","Errate die Zahl von 1 bis 20."]], m = sterne();

    '<div class="card"><h2>🔤 Vokabel-Memory</h2><p>Finde Wort und Übersetzung aus deinen eigenen Listen.</p><button class="btn" id="vmem" type="button">Spielen (1 Münze)</button></div></div>';

  document.getElementById("vmem").onclick = vokMemory;

/* Zusammen lernen: Quiz fuer 2 bis 3 Personen auf verschiedenen Geraeten (Nachrichten ueber ntfy.sh) */
var zES, zT;
function zStop(){ if(zES){ zES.close(); zES = null; } clearTimeout(zT); }
function zusammen(){
  zStop();
  const alle = THEMEN.flatMap(t => t.lektionen.flatMap(l => l.quiz || [])), kopf = '<p><a href="#">Zurück</a></p><h1>Zusammen lernen</h1>';
  if(alle.length < 4){ app.innerHTML = kopf + fuxBox("Dafür brauche ich mindestens 4 Quizfragen."); return; }
  app.innerHTML = kopf + fuxBox("Lerne mit bis zu <strong>2 Freunden</strong> auf verschiedenen Geräten. Alle brauchen dieselbe LernFux-Datei und Internet.") +
    '<article class="lesson"><p><label>Dein Spitzname<br><input id="zn" class="antw" maxlength="12" autocomplete="off"></label></p><p><button class="btn gross" id="zneu" type="button">Neuen Raum öffnen</button></p><h2>Oder beitreten</h2><p><label>Raum-Code<br><input id="zc" class="antw" maxlength="6" autocomplete="off" style="text-transform:uppercase"></label></p><p><button class="btn" id="zbei" type="button">Beitreten</button></p><p class="fb" id="zf" role="status"></p><p class="meta">Tipp: Nimm nur einen Spitznamen, keinen echten Namen.</p></article>';
  const name = () => document.getElementById("zn").value.trim(), fe = t => { document.getElementById("zf").textContent = t; };
  document.getElementById("zneu").onclick = () => { if(!name()) return fe("Trage zuerst deinen Spitznamen ein."); const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for(let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)]; zRaum(c, true, name(), alle); };
  document.getElementById("zbei").onclick = () => { const c = document.getElementById("zc").value.trim().toUpperCase(); if(!name()) return fe("Trage zuerst deinen Spitznamen ein."); if(!/^[A-HJ-NP-Z2-9]{6}$/.test(c)) return fe("Der Code hat 6 Zeichen."); zRaum(c, false, name(), alle); };
}
function zRaum(code, host, name, alle){
  const me = Math.random().toString(36).slice(2, 8), url = "https://ntfy.sh/lernfux-" + code, kopf = '<p><button class="btn" id="zx" type="button">Verlassen</button></p><h1>Zusammen lernen</h1>';
  const meta = THEMEN.flatMap(t => t.lektionen.flatMap(l => (l.quiz || []).map(() => t.id))), themen = THEMEN.filter(t => meta.includes(t.id)), EM = ["👍", "🎉", "😮", "😅"];
  let sp = [], ix = [], q = -1, ant = {}, beantw = false, phase = "lobby", offen = false, t0 = 0, emOk = true;
  const fe = t => { const f = document.getElementById("zf"); if(f) f.textContent = t; };
  const pub = m => fetch(url, {method: "POST", body: JSON.stringify(m)}).catch(() => fe("Keine Verbindung."));
  const pts = id => Object.values(ant).reduce((a, r) => a + (r[id] ? r[id].p : 0), 0);
  const tafel = () => sp.map(p => esc(p.n) + (phase === "spiel" && ant[q] && ant[q][p.id] ? " ✓" : "") + ': <strong>' + pts(p.id) + '</strong>').join(" · ");
  const bind = () => { document.getElementById("zx").onclick = () => geheZu("#"); };
  app.innerHTML = kopf + fuxBox("Verbinde …") + '<p class="fb" id="zf" role="status"></p>'; bind();
  const lobby = () => {
    app.innerHTML = kopf + fuxBox('Raum-Code: <strong style="font-size:1.6em;letter-spacing:.15em">' + code + '</strong><br>Schicke den Code deinen Freunden.') + '<article class="lesson"><h2>Im Raum</h2><ul>' + sp.map(p => '<li>' + esc(p.n) + (p.id === me ? " (du)" : "") + '</li>').join("") + '</ul>' +
      (host ? '<p><label>Thema<br><select id="zth"><option value="">Alle Themen</option>' + themen.map(t => '<option value="' + esc(t.id) + '">' + esc(t.titel) + '</option>').join("") + '</select></label></p><p><label>Fragen<br><select id="zan"><option>5</option><option selected>8</option><option>10</option></select></label></p><p><button class="btn gross" id="zgo" type="button"' + (sp.length < 2 ? " disabled" : "") + '>Los geht’s</button></p>' : '<p class="meta">Warte, bis der Gastgeber startet.</p>') + '<p class="fb" id="zf" role="status"></p></article>';
    bind();
    if(host) document.getElementById("zgo").onclick = () => { const th = document.getElementById("zth").value, pool = alle.map((_, i) => i).filter(i => !th || meta[i] === th); pub({t: "go", ix: mischen(pool).slice(0, Math.min(+document.getElementById("zan").value || 8, pool.length)), n: alle.length}); };
  };
  const frage = () => {
    clearTimeout(zT); beantw = false; const f = alle[ix[q]];
    app.innerHTML = kopf + '<p class="meta" id="ztf">' + tafel() + '</p><p class="meta">Frage ' + (q + 1) + ' von ' + ix.length + '</p><article class="lesson"><h1 class="aufgtitel">' + esc(f.frage) + '</h1>' + f.optionen.map((o, oi) => '<button type="button" class="opt" data-o="' + oi + '">' + esc(o) + '</button>').join("") + '<p class="fb" id="zf" role="status"></p></article><div class="zau" id="zau" aria-live="polite"></div><p class="meta" id="zre" aria-live="polite">&nbsp;</p><p>' + EM.map((e, i) => '<button type="button" class="btn" data-e="' + i + '" aria-label="Reaktion ' + e + '">' + e + '</button>').join(" ") + '</p>';
    bind();
    app.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { if(!emOk) return; emOk = false; setTimeout(() => { emOk = true; }, 1500); pub({t: "e", id: me, e: +b.dataset.e}); });
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if(beantw) return; beantw = true; const ok = +b.dataset.o === f.richtig, ms = Date.now() - t0;
      app.querySelectorAll(".opt").forEach(x => x.disabled = true); app.querySelectorAll(".opt")[f.richtig].classList.add("ok"); if(!ok) b.classList.add("falsch");
      fe((ok ? "Richtig! " : "Nicht ganz. ") + (f.erklaerung ? f.erklaerung + " " : "") + "Warte auf die anderen."); pub({t: "a", id: me, q: q, ok: ok, ms: ms, o: +b.dataset.o});
    });
    t0 = Date.now(); if(host) zT = setTimeout(() => pub({t: "nx", q: q + 1}), 25000);
  };
  const ende = () => {
    clearTimeout(zT); const r = sp.map(p => [p, pts(p.id)]).sort((a, b) => b[1] - a[1]), top = r[0][1], sieger = r.filter(x => x[1] === top).map(x => esc(x[0].n)).join(" und "), med = ["🥇", "🥈", "🥉"];
    app.innerHTML = '<h1>Ergebnis</h1>' + fuxBox("Gewonnen hat <strong>" + sieger + "</strong> mit " + top + " Punkten!", "jubel") + '<article class="lesson"><ol>' + r.map((x, n) => '<li>' + med[n] + ' ' + esc(x[0].n) + ': <strong>' + x[1] + '</strong> Punkte</li>').join("") + '</ol><p class="meta">Richtig gibt 10 Punkte, schnell sein bringt bis zu 5 dazu.</p></article><p><button class="btn gross" id="zok" type="button">Fertig</button></p>';
    document.getElementById("zok").onclick = () => geheZu("#"); if(pts(me) === top) konfetti();
  };
  const auswertung = () => {
    const f = alle[ix[q]], e = document.getElementById("zau"); if(!e || !ant[q]) return;
    e.innerHTML = '<strong>Richtig war: ' + esc(f.optionen[f.richtig]) + '</strong><ul>' + sp.map(p => { const a = ant[q][p.id]; return '<li>' + esc(p.n) + ': ' + (!a ? "keine Antwort" : (Number.isInteger(a.o) && f.optionen[a.o] !== undefined ? esc(f.optionen[a.o]) : "–") + (a.ok ? " ✓ (+" + a.p + ")" : " ✗")) + '</li>'; }).join("") + '</ul>';
  };
  const ein = m => {
    if(!m || typeof m !== "object") return;
    if(m.t === "hi" && host && phase === "lobby" && typeof m.id === "string" && typeof m.n === "string"){ if(!sp.some(p => p.id === m.id) && sp.length < 3) sp.push({id: m.id.slice(0, 8), n: m.n.slice(0, 12)}); pub({t: "r", p: sp}); }
    else if(m.t === "r" && phase === "lobby" && Array.isArray(m.p)){ const n = m.p.filter(p => p && typeof p.id === "string" && typeof p.n === "string").slice(0, 3).map(p => ({id: p.id.slice(0, 8), n: p.n.slice(0, 12)})); if(n.some(p => p.id === me)){ sp = n; lobby(); } }
    else if(m.t === "go" && phase === "lobby" && sp.some(p => p.id === me)){
      if(m.n !== alle.length) return fe("Ihr habt unterschiedliche LernFux-Dateien.");
      if(!Array.isArray(m.ix) || !m.ix.length || !m.ix.every(i => Number.isInteger(i) && i >= 0 && i < alle.length)) return;
      ix = m.ix.slice(0, 10); phase = "spiel"; ant = {}; q = 0; frage();
    }
    else if(m.t === "a" && phase === "spiel" && typeof m.ok === "boolean" && Number.isFinite(m.ms) && Number.isInteger(m.q) && m.q >= 0 && m.q < ix.length && sp.some(p => p.id === m.id)){
      ant[m.q] = ant[m.q] || {}; if(!ant[m.q][m.id]) ant[m.q][m.id] = {ok: m.ok, o: Number.isInteger(m.o) && m.o >= 0 && m.o < alle[ix[m.q]].optionen.length ? m.o : undefined, p: m.ok ? 10 + Math.max(0, Math.round(5 * (1 - Math.min(Math.max(m.ms, 0), 15000) / 15000))) : 0};
      if(m.q === q){ const t = document.getElementById("ztf"); if(t) t.innerHTML = tafel(); if(sp.every(p => ant[q][p.id])){ auswertung(); if(host){ clearTimeout(zT); zT = setTimeout(() => pub({t: "nx", q: q + 1}), 4500); } } }
    }
    else if(m.t === "e" && phase === "spiel" && Number.isInteger(m.e) && m.e >= 0 && m.e < EM.length){ const p = sp.find(x => x.id === m.id), r = document.getElementById("zre"); if(p && r) r.textContent = p.n + " " + EM[m.e]; }
    else if(m.t === "nx" && phase === "spiel" && m.q === q + 1){ q = m.q; if(q >= ix.length){ phase = "ende"; ende(); } else frage(); }
  };
  zES = new EventSource(url + "/sse");
  zES.onmessage = e => { try { const d = JSON.parse(e.data); if(d.event === "message") ein(JSON.parse(d.message)); } catch(x){} };
  zES.onerror = () => fe("Die Verbindung wackelt …");
  zES.onopen = () => { if(offen) return; offen = true; if(host){ sp = [{id: me, n: name.slice(0, 12)}]; lobby(); } else { pub({t: "hi", id: me, n: name.slice(0, 12)}); zT = setTimeout(() => { if(!sp.some(p => p.id === me)) fe("Raum nicht gefunden oder schon voll."); }, 8000); } };
}
function tagesaufgabe(){
  const alle = THEMEN.flatMap(t => t.lektionen.flatMap(l => l.quiz || [])), kopf = '<p><a href="#">Zurück</a></p><h1>Tagesaufgabe</h1>', heute = new Date().toDateString(), tg = fortschritt._tag;
  if(!alle.length){ app.innerHTML = kopf + fuxBox("Noch keine Quizfragen."); return; }
  if(tg && tg.d === heute){ app.innerHTML = kopf + fuxBox(tg.ok ? "Heute schon geschafft. Bis morgen!" : "Heute schon probiert. Morgen gibt es eine neue Aufgabe.", tg.ok ? "froh" : "denk"); return; }
  const d = new Date(), f = alle[Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) % alle.length];
  app.innerHTML = kopf + fuxBox("Eine Aufgabe pro Tag. Du hast nur einen Versuch!") + '<article class="lesson"><h2 class="aufgtitel">' + esc(f.frage) + '</h2>' + f.optionen.map((o, oi) => '<button type="button" class="opt" data-o="' + oi + '">' + esc(o) + '</button>').join("") + '<p class="fb" role="status" id="tf" hidden></p></article>';
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.o === f.richtig; app.querySelectorAll(".opt").forEach(x => x.disabled = true); app.querySelectorAll(".opt")[f.richtig].classList.add("ok"); if(!ok) b.classList.add("falsch");
    fortschritt._tag = {d: heute, ok: ok}; speichern(fortschritt);
    const fb = document.getElementById("tf"); fb.className = "fb " + (ok ? "gut" : "schlecht"); fb.textContent = (ok ? "Richtig! " : "Nicht ganz. ") + (f.erklaerung || ""); fb.hidden = false; if(ok) konfetti();
  });
}
